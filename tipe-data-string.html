<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tipe Data String</title>
</head>
<body>
  <script>
    // String biasa
    document.writeln("Rajie Al Qadri Anwar");
    document.writeln("<br>");
    document.writeln("Hafidz Quran Jago Computer");
    document.writeln("<br><br>");

    // String dengan penggabungan (concatenation)
    document.writeln("Nama : " + "Rajie " + "Al Qadri " + "Anwar");
    document.writeln("<br>");
    document.writeln("Channel : " + "Hafidz Quran Jago Computer");
    document.writeln("<br><br>");

    // String dengan karakter khusus (\n = enter/newline)
    document.writeln("<textarea cols='100' rows='10'>");
    document.write("Rajie \nAl Qadri \nAnwar\n");
    document.write("\\Home\\Anwar\n"); // contoh escape karakter backslash
    document.write("Hafidz Quran Jago Computer\n");
    document.write("Belajar JavaScript\n");
    document.writeln("</textarea>");
  </script>
</body>
</html>
