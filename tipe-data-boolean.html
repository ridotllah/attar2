<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tipe Data Boolean</title>
</head>
<body>
  <script>
    document.writeln(true);   // boolean true → benar
    document.writeln("<br>");
    document.writeln(false);  // boolean false → salah
  </script>
