<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    #include <stdio.h>
int main() {
    int choice;
    double num1, num2;

    do {
        printf("\nMenu:\n");
        printf("1. Penjumlahan\n");
        printf("2. Pengurangan\n");
        printf("3. Perkalian\n");
        printf("4. Pembagian\n");
        printf("5. Keluar\n");
        printf("Pilih operasi: ");
        scanf("%d", &choice);

        if (choice >= 1 && choice <= 4) {
            printf("Masukkan dua angka: ");
            scanf("%lf %lf", &num1, &num2);

            while (choice == 4 && num2 == 0) {
                printf("Pembagi tidak boleh nol! Masukkan angka kedua lagi: ");
                scanf("%lf", &num2);
            }

            switch (choice) {
                case 1:
                    printf("Hasil: %.2lf\n", num1 + num2);
                    break;
                case 2:
                    printf("Hasil: %.2lf\n", num1 - num2);
                    break;
                case 3:
                    printf("Hasil: %.2lf\n", num1 * num2);
                    break;
                case 4:
                    printf("Hasil: %.2lf\n", num1 / num2);
                    break;
            }
        } else if (choice != 5) {
            printf("Pilihan tidak valid!\n");
        }

    } while (choice != 5);

    printf("Terima kasih!\n");
    return 0;
}
</script>
</body>
</html>
