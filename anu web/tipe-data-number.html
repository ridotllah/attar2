<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tipe Data Number</title>
</head>
<body>
  <script>
    document.writeln(100);          // Bilangan bulat (integer)
    document.writeln("<br>");
    document.writeln(100.123);      // Bilangan desimal (floating point)
    document.writeln("<br>");
    document.writeln(0b1111010);    // Bilangan biner (binary → 122 desimal)
  </script>
</body>
</html>
